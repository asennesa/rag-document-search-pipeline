[project]
name = "rag-document-search-pipeline"
version = "0.1.0"
description = "Explicit local embeddings, Qdrant retrieval, and grounded generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "pymupdf==2.0",
  "fastembed==0.9.1",
  "onnxruntime==1.31.1",
  "numpy==2.5.4",
  "tokenizers==0.23.3",
  "huggingface-hub==1.33.0",
  "qdrant-client==1.20.0",
  "ollama==0.6.3",
  "streamlit==1.66.1",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag_pipeline"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = [
  "integration: requires explicitly prepared external infrastructure",
  "model: requires explicitly prepared model assets",
  "ollama: requires a running local Ollama service and prepared model",
  "benchmark: isolated reproducible performance measurement",
]
